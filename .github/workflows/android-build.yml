
name: PDF Vault Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q PDFVaultAndroid_Starter_v1.0.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/PDFVaultAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Vault-Android-APK
          path: extracted/PDFVaultAndroid/app/build/outputs/apk/debug/app-debug.apk
          
